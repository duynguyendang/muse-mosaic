[project]
name = "muse-mosaic"
version = "0.1.0"
description = "Muse Mosaic — multi-source golden-record pipeline with trust boundaries"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.14",
    "black>=25.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".agents", ".stitch", ".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars — catches dead code)
    "I",   # isort (import order)
    "B",   # flake8-bugbear (except-pass, mutable defaults, blind except)
    "UP",  # pyupgrade (py312 idioms)
]
ignore = [
    "E501",  # line length handled by black; long URLs/strings are fine
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["schemas.StrictModel"]

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = "(.agents|.stitch|.venv|venv|__pycache__)"
